<!doctype html>
<html lang="th">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>รายงานผลการตรวจ - Rice AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Sarabun', sans-serif; }
        .bg-map-pattern {
            background-color: #f3f4f6;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%239CA3AF' fill-opacity='0.1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
    </style>
    <script src="/api-config.js"></script>
</head>

<body class="bg-[#F3F4F6] text-gray-800 min-h-screen flex flex-col">

    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 lg:px-6 h-16 flex justify-between items-center">
            <div class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 px-3 py-2 rounded-lg transition" onclick="window.location.href='history.html'">
                <div class="w-8 h-8 bg-green-600 rounded-lg flex items-center justify-center text-white shadow-sm">
                    <i class="fa-solid fa-chevron-left"></i>
                </div>
                <span class="font-bold text-lg text-gray-700">ย้อนกลับ</span>
            </div>
            <div class="font-bold text-xl text-gray-800 hidden md:block">รายงานผลการตรวจ</div>
            <div class="w-8"></div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl mx-auto w-full p-4 lg:p-6 space-y-6">

        <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <div class="flex items-center gap-3 mb-2">
                    <h1 id="disp-disease" class="text-3xl md:text-4xl font-bold text-gray-900">กำลังโหลด...</h1>
                    <span id="disp-badge" class="px-3 py-1 rounded-full text-sm font-bold bg-gray-100 text-gray-400 border border-gray-200">
                        รอผล
                    </span>
                </div>
                <p id="disp-date" class="text-gray-500 flex items-center gap-2 text-sm md:text-base">
                    <i class="fa-regular fa-clock"></i> ...
                </p>
            </div>
            
            
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <div class="lg:col-span-8 space-y-6">
                
                <div class="bg-white rounded-3xl shadow-sm overflow-hidden border border-gray-100">
                    <div class="p-4 border-b border-gray-50 flex justify-between items-center">
                        <h4 class="font-bold text-gray-700 flex items-center gap-2">
                            <i class="fa-solid fa-image text-green-600"></i> รูปภาพที่วิเคราะห์
                        </h4>
                    </div>
                    <div class="p-2 bg-gray-50">
                        <div class="relative aspect-video rounded-2xl overflow-hidden bg-gray-200 group shadow-inner">
                            <img id="disp-image" src="" class="w-full h-full object-contain transition duration-500 group-hover:scale-105">
                            
                            <div class="absolute bottom-4 right-4 bg-black/60 text-white text-xs px-3 py-1.5 rounded-full backdrop-blur-md">
                                <i class="fa-solid fa-camera mr-1"></i> ภาพหลัก
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm p-6 border border-gray-100">
                    <h3 class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center border border-blue-100 shadow-sm">
                            <i class="fa-solid fa-user-doctor text-lg"></i>
                        </div>
                        คำแนะนำการรักษา
                    </h3>
                    <div id="disp-advice" class="space-y-4">
                        <div class="animate-pulse flex space-x-4">
                            <div class="rounded-full bg-gray-200 h-10 w-10"></div>
                            <div class="flex-1 space-y-2 py-1">
                                <div class="h-4 bg-gray-200 rounded w-3/4"></div>
                                <div class="h-4 bg-gray-200 rounded w-1/2"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-4 space-y-6">
                
                <div class="bg-white rounded-3xl shadow-md border border-gray-100 overflow-hidden relative">
                    <div class="absolute top-0 right-0 p-4 opacity-10">
                        <i class="fa-solid fa-bullseye text-8xl text-green-600"></i>
                    </div>
                    
                    <div class="p-6 flex flex-col items-center justify-center text-center h-full min-h-[220px]">
                        <h4 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-4">ความแม่นยำในการวิเคราะห์</h4>
                        
                        <div class="relative w-32 h-32 mb-4">
                            <div id="disp-chart-ring" class="w-full h-full rounded-full shadow-lg" 
                                 style="background: conic-gradient(#16a34a 0% 0%, #f3f4f6 0% 100%); transition: background 1s ease-out;">
                            </div>
                            <div class="absolute inset-3 bg-white rounded-full flex items-center justify-center shadow-inner">
                                <div class="text-center">
                                    <span id="disp-confidence" class="block text-3xl font-extrabold text-gray-800 leading-none">0%</span>
                                    <span class="text-[10px] text-gray-400 font-bold uppercase">Confidence</span>
                                </div>
                            </div>
                        </div>
                        
                        <p class="text-sm text-gray-500">
                            ผลลัพธ์นี้ประมวลผลโดย AI<br>ร่วมกับปัจจัยแวดล้อม
                        </p>
                    </div>
                    <div id="accuracy-bar" class="h-2 w-full bg-gray-200"></div>
                </div>

                <div class="bg-white rounded-3xl shadow-md overflow-hidden border border-gray-100 flex flex-col">
                    <div class="bg-map-pattern h-40 w-full relative flex items-center justify-center border-b border-gray-100 group cursor-pointer" onclick="openMap()">
                        <div class="absolute inset-0 bg-green-500/5 group-hover:bg-green-500/10 transition"></div>
                        <div class="absolute text-red-500 text-4xl drop-shadow-lg animate-bounce" style="animation-duration: 2s;">
                            <i class="fa-solid fa-location-dot"></i>
                        </div>
                        <div class="absolute bottom-0 w-full h-8 bg-gradient-to-t from-black/10 to-transparent"></div>
                        <button class="absolute bottom-3 right-3 bg-white hover:bg-green-50 text-gray-700 text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm border border-gray-200 transition flex items-center gap-1">
                            Google Maps <i class="fa-solid fa-up-right-from-square text-[10px]"></i>
                        </button>
                    </div>
                    
                    <div class="p-5 flex-grow">
                        <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">พิกัดแปลงนา (GIS)</h4>
                        <div class="flex items-start gap-3">
                            <div class="mt-1 w-8 h-8 rounded-lg bg-green-50 text-green-600 flex items-center justify-center flex-shrink-0">
                                <i class="fa-solid fa-map-location-dot"></i>
                            </div>
                            <div>
                                <p id="disp-location-name" class="font-bold text-gray-800 leading-tight mb-1">กำลังโหลด...</p>
                                <div class="bg-gray-100 rounded px-2 py-1 inline-block">
                                    <p id="disp-latlng" class="text-xs text-gray-500 font-mono">Lat: -, Lng: -</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm p-5 border border-gray-100">
                    <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-4">ข้อมูลประกอบ</h4>
                    <div class="flex items-center gap-3 p-3 rounded-xl bg-yellow-50 border border-yellow-100">
                        <div class="w-10 h-10 rounded-full bg-white text-yellow-600 flex items-center justify-center shadow-sm">
                            <i class="fa-solid fa-seedling"></i>
                        </div>
                        <div>
                            <p class="text-[10px] text-gray-500 uppercase font-bold">พันธุ์ข้าว</p>
                            <p id="disp-variety" class="font-bold text-gray-800 text-sm">-</p>
                        </div>
                    </div>
                </div>

                <button onclick="window.location.href='home.html'" class="w-full py-4 rounded-2xl border-2 border-gray-200 text-gray-600 font-bold hover:bg-gray-50 hover:text-gray-800 hover:border-gray-300 transition flex justify-center items-center gap-2">
                    <i class="fa-solid fa-home"></i> กลับหน้าหลัก
                </button>

            </div>
        </div>
    </main>

    <script>
        let mapUrl = "#"; 

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                let data = null;

                const storedItem = localStorage.getItem('view_history_item');
                
                if (storedItem) {
                    console.log("📦 Loaded from LocalStorage");
                    data = JSON.parse(storedItem);
                    localStorage.removeItem('view_history_item');
                } 
                
                if (!data) {
                    console.log("🔄 Fetching latest from Server...");
                    const response = await fetch((window.RICE_API_URL || '') + '/get-latest-history');
                    data = await response.json();
                }

                if (!data || data.message) throw new Error("No Data Found");

                const imgElem = document.getElementById('disp-image');
                let imgSrc = data.image_base64;

                
                if (!imgSrc) {
                    const dName = data.disease.toLowerCase();
                    if (dName.includes('ปกติ') || dName.includes('healthy')) {
                        imgSrc = "https://images.unsplash.com/photo-1586201375761-83865001e31c?q=80&w=800&auto=format&fit=crop"; 
                    } else {
                        imgSrc = "https://images.unsplash.com/photo-1615486511484-92e172cc416d?q=80&w=800&auto=format&fit=crop";
                    }
                }
                imgElem.src = imgSrc;
                

                document.getElementById('disp-disease').innerText = data.disease;
                document.getElementById('disp-variety').innerText = mapVarietyName(data.variety_code);
                
                const dateObj = new Date(data.timestamp);
                document.getElementById('disp-date').innerHTML = `<i class="fa-regular fa-clock text-green-600"></i> ตรวจเมื่อ: ${dateObj.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' })} เวลา ${dateObj.toLocaleTimeString('th-TH')} น.`;

                const locName = data.location_name || "ไม่ระบุตำแหน่ง";
                document.getElementById('disp-location-name').innerText = locName;
                document.getElementById('disp-latlng').innerText = `${parseFloat(data.latitude).toFixed(6)}, ${parseFloat(data.longitude).toFixed(6)}`;
                mapUrl = `https://www.google.com/maps/search/?api=1&query=${data.latitude},${data.longitude}`;

                const score = parseFloat(data.confidence.replace('%', ''));
                const percentText = document.getElementById('disp-confidence');
                const chartRing = document.getElementById('disp-chart-ring');
                const accuracyBar = document.getElementById('accuracy-bar');
                
                animateValue(percentText, 0, score, 1000);

                let color = '#22c55e'; 
                if (score < 50) color = '#ef4444'; 
                else if (score < 80) color = '#eab308'; 

                chartRing.style.background = `conic-gradient(${color} 0% ${score}%, #f3f4f6 ${score}% 100%)`;
                accuracyBar.style.backgroundColor = color;
                percentText.style.color = color;
                percentText.innerText = Math.round(score) + "%";

                const badge = document.getElementById('disp-badge');
                const dName = data.disease.toLowerCase();
                if(dName.includes('ปกติ') || dName.includes('healthy') || dName.includes('normal')) {
                    badge.className = "px-3 py-1 rounded-full text-sm font-bold bg-green-100 text-green-700 border border-green-200";
                    badge.innerHTML = '<i class="fa-solid fa-check-circle mr-1"></i> ปกติ';
                } else {
                    badge.className = "px-3 py-1 rounded-full text-sm font-bold bg-red-100 text-red-700 border border-red-200";
                    badge.innerHTML = '<i class="fa-solid fa-triangle-exclamation mr-1"></i> พบเชื้อ';
                }

                updateAdviceContent(data.disease);

            } catch (error) {
                console.error("Render Error:", error);
                document.getElementById('disp-disease').innerText = "ไม่พบข้อมูล";
            }
        });

        function openMap() { window.open(mapUrl, '_blank'); }

        function mapVarietyName(code) {
            const map = { 'kdm105': 'ขาวดอกมะลิ 105', 'rd15': 'กข15', 'rd6': 'กข6 (ข้าวเหนียว)', 'rd41': 'กข41', 'unknown': 'ไม่ระบุ' };
            return map[code] || code;
        }

        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start) + "%";
                if (progress < 1) { window.requestAnimationFrame(step); }
            };
            window.requestAnimationFrame(step);
        }

        function updateAdviceContent(disease) {
            const box = document.getElementById('disp-advice');
            const d = disease ? disease.toLowerCase() : "";
            let html = '';
            
            if (d.includes('ไหม้') || d.includes('blast')) {
                html = `
                    <div class="flex gap-4 p-4 bg-blue-50 rounded-2xl border border-blue-100 transition hover:shadow-md">
                        <div class="flex-none w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-lg shadow-sm">1</div>
                        <div><h4 class="font-bold text-gray-800 text-lg">จัดการน้ำ</h4><p class="text-sm text-gray-600 mt-1">ระบายน้ำออกจากแปลงนาเพื่อลดความชื้นที่โคนกอข้าว</p></div>
                    </div>
                    <div class="flex gap-4 p-4 bg-white rounded-2xl border border-gray-200 transition hover:shadow-md">
                        <div class="flex-none w-10 h-10 rounded-full bg-gray-100 text-gray-500 flex items-center justify-center font-bold text-lg">2</div>
                        <div><h4 class="font-bold text-gray-800 text-lg">การใช้ยา</h4><p class="text-sm text-gray-600 mt-1">ฉีดพ่นสารไตรไซคลาโซล (Tricyclazole) ตามอัตราส่วน</p></div>
                    </div>
                    <div class="flex gap-4 p-4 bg-white rounded-2xl border border-gray-200 transition hover:shadow-md">
                        <div class="flex-none w-10 h-10 rounded-full bg-gray-100 text-gray-500 flex items-center justify-center font-bold text-lg">3</div>
                        <div><h4 class="font-bold text-gray-800 text-lg">ปุ๋ย</h4><p class="text-sm text-gray-600 mt-1">งดใส่ปุ๋ยยูเรีย (ไนโตรเจน) ชั่วคราวเพื่อลดการลุกลาม</p></div>
                    </div>`;
            } else if (d.includes('ขอบใบ') || d.includes('blight') || d.includes('แห้ง')) {
                html = `
                   <div class="flex gap-4 p-4 bg-orange-50 rounded-2xl border border-orange-100 transition hover:shadow-md">
                        <div class="flex-none w-10 h-10 rounded-full bg-orange-500 text-white flex items-center justify-center font-bold text-lg">1</div>
                        <div><h4 class="font-bold text-gray-800 text-lg">ตัดวงจร</h4><p class="text-sm text-gray-600">ทำลายตอซังและวัชพืชหลังการเก็บเกี่ยว</p></div>
                    </div>
                    <div class="flex gap-4 p-4 bg-white rounded-2xl border border-gray-200 transition hover:shadow-md">
                        <div class="flex-none w-10 h-10 rounded-full bg-gray-100 text-gray-500 flex items-center justify-center font-bold text-lg">2</div>
                        <div><h4 class="font-bold text-gray-800 text-lg">การใช้ยา</h4><p class="text-sm text-gray-600 mt-1">ใช้สารคอปเปอร์ไฮดรอกไซด์ หรือ ไอโซโพรไทโอเลน</p></div>
                    </div>`;
            } else if (d.includes('ปกติ') || d.includes('healthy') || d.includes('normal')) {
                html = `<div class="p-8 text-center bg-green-50 rounded-3xl border border-green-100"><i class="fa-solid fa-plant-wilt text-5xl text-green-500 mb-3"></i><h4 class="font-bold text-green-700 text-xl">สุขภาพดีเยี่ยม</h4><p class="text-green-600">ดูแลรักษาตามปกติ และหมั่นสำรวจแปลงนาอย่างสม่ำเสมอ</p></div>`;
            } else {
                html = `<div class="p-4 text-center text-gray-500">ไม่พบคำแนะนำสำหรับ: ${disease}</div>`;
            }
            box.innerHTML = html;
        }
    </script>
</body>
</html>
