<!doctype html>
<html lang="th">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rice AI - ยืนยัน OTP และตั้งรหัสผ่านใหม่</title>
    <link rel="stylesheet" href="./src/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Noto Sans Thai"', 'sans-serif'] }
                }
            }
        }
    </script>
    <script src="/api-config.js"></script>
</head>

<body class="bg-gray-50 min-h-screen flex flex-col font-sans">

    <nav class="bg-white text-black shadow-md sticky top-0 z-50">
        <div class="w-full px-4 lg:px-6">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-2">
                    <img src="/image/logo.png" alt="Rice AI Logo" class="h-10 w-auto object-contain mb-1" />
                    <span class="font-bold text-xl tracking-wide text-gray-800">Rice AI analysis</span>
                </div>
            </div>
        </div>
    </nav>

    <div class="flex-grow flex items-center justify-center p-4 md:p-8">
        <div
            class="bg-white rounded-[48px] shadow-2xl overflow-hidden flex flex-col md:flex-row w-full max-w-7xl h-auto min-h-[650px]">

            <div class="w-full md:w-1/2 p-0 h-64 md:h-auto hidden md:block">
                <div class="relative w-full h-full">
                    <img src="./public/image/loginpic.png" alt="Rice Field"
                        class="absolute inset-0 w-full h-full object-cover" />
                    <div class="absolute inset-0 bg-black/20"></div>
                </div>
            </div>

            <div class="w-full md:w-1/2 p-10 md:p-14 flex flex-col justify-center items-center">

                <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mb-6">
                    <i class="fa-solid fa-key text-4xl text-green-600"></i>
                </div>

                <h2 class="text-3xl font-extrabold text-gray-900 mb-2">ตั้งรหัสผ่านใหม่</h2>
                <p class="text-gray-500 mb-8 text-sm font-bold text-center">
                    กรุณากรอกรหัส OTP ที่ได้รับทาง SMS <br> และตั้งรหัสผ่านใหม่ของคุณ
                </p>

                <div class="w-full max-w-sm space-y-5">

                    <div
                        class="bg-green-50 border border-green-200 text-green-800 px-4 py-3 rounded-xl text-center text-sm font-bold mb-4">
                        OTP ส่งไปที่เบอร์: <span id="display-phone"
                            class="text-green-600 underline font-mono text-base ml-1">...</span>
                    </div>

                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">รหัส OTP (6 หลัก)</label>
                        <div class="relative">
                            <input id="otp-input" type="text" maxlength="6" placeholder="XXXXXX"
                                class="w-full pl-12 pr-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:outline-none focus:border-green-500 focus:ring-2 focus:ring-green-200 transition font-medium tracking-widest text-lg text-center" />
                            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-green-600">
                                <i class="fa-solid fa-message"></i>
                            </span>
                        </div>
                    </div>

                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">รหัสผ่านใหม่</label>
                        <div class="relative">
                            <input id="new-password" type="password" placeholder="••••••••"
                                class="w-full pl-12 pr-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:outline-none focus:border-green-500 focus:ring-2 focus:ring-green-200 transition font-medium" />
                            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-green-600">
                                <i class="fa-solid fa-lock"></i>
                            </span>
                        </div>
                    </div>

                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">ยืนยันรหัสผ่านใหม่</label>
                        <div class="relative">
                            <input id="confirm-password" type="password" placeholder="••••••••"
                                class="w-full pl-12 pr-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:outline-none focus:border-green-500 focus:ring-2 focus:ring-green-200 transition font-medium" />
                            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-green-600">
                                <i class="fa-solid fa-circle-check"></i>
                            </span>
                        </div>
                    </div>

                    <button id="submit-btn" onclick="submitReset()"
                        class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 text-lg mt-4">
                        ยืนยันการเปลี่ยนรหัสผ่าน
                    </button>

                    <div class="text-center mt-6">
                        <a href="forgot_password.html"
                            class="text-gray-500 hover:text-gray-800 font-bold text-sm flex items-center justify-center gap-2 transition">
                            <i class="fa-solid fa-arrow-left"></i> ขอรับรหัสใหม่ / เปลี่ยนเบอร์
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
const API_URL = window.RICE_API_URL || '';

        document.addEventListener('DOMContentLoaded', () => {

            const contactInfo = localStorage.getItem('reset_contact');
            const method = localStorage.getItem('reset_method');

            const displayElement = document.getElementById('display-phone');
            const labelElement = document.getElementById('contact-label');

            if (contactInfo) {

                if (displayElement) displayElement.innerText = contactInfo;


                if (labelElement) {
                    if (method === 'email' || contactInfo.includes('@')) {
                        labelElement.innerText = 'OTP ส่งไปที่อีเมล:';
                    } else {
                        labelElement.innerText = 'OTP ส่งไปที่เบอร์:';
                    }
                }
            } else {

                alert('ไม่พบข้อมูลการติดต่อ กรุณาทำรายการใหม่');
                window.location.href = 'forgetP.html';
            }
        });

        async function submitReset() {
            const otp = document.getElementById('otp-input').value.trim();
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const btn = document.getElementById('submit-btn');

            if (otp.length !== 6) return alert('กรุณากรอกรหัส OTP 6 หลัก');
            if (newPassword.length < 6) return alert('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');
            if (newPassword !== confirmPassword) return alert('รหัสผ่านยืนยันไม่ตรงกัน');

            const originalText = btn.innerText;
            btn.innerText = 'กำลังดำเนินการ...';
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');

            try {

                const phone = localStorage.getItem('reset_phone');

                const res = await fetch(`${API_URL}/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token: otp,
                        newPassword: newPassword,
                        phone: phone
                    })
                });

                const data = await res.json();

                if (data.success) {
                    alert('✅ เปลี่ยนรหัสผ่านเรียบร้อยแล้ว!\nกรุณาเข้าสู่ระบบด้วยรหัสผ่านใหม่');
                    localStorage.removeItem('reset_phone');
                    window.location.href = 'index.html';
                } else {
                    alert('❌ ' + (data.message || 'รหัส OTP ไม่ถูกต้อง'));
                    resetButton(originalText);
                }

            } catch (error) {
                console.error(error);
                alert('ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้');
                resetButton(originalText);
            }
        }

        function resetButton(text) {
            const btn = document.getElementById('submit-btn');
            btn.innerText = text;
            btn.disabled = false;
            btn.classList.remove('opacity-50', 'cursor-not-allowed');
        }
    </script>
</body>

</html>
