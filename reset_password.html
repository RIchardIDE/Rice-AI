<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rice AI - ตั้งรหัสผ่านใหม่</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Noto Sans Thai"', 'sans-serif'] },
                    colors: { rice_green: '#16a34a' }
                }
            }
        }
    </script>
    <script src="/api-config.js"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4 font-sans">

    <div class="bg-white p-8 rounded-[32px] shadow-2xl w-full max-w-md border border-gray-100 relative overflow-hidden">
        
        <div class="absolute top-0 right-0 -mt-10 -mr-10 w-32 h-32 bg-green-50 rounded-full blur-2xl opacity-60"></div>

        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-green-100 text-rice_green rounded-full flex items-center justify-center mx-auto mb-4 shadow-sm">
                <i class="fa-solid fa-envelope-open-text text-3xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-800">ยืนยันตัวตนผ่านอีเมล</h2>
            <p class="text-gray-500 text-sm mt-2">กรุณากรอกรหัส OTP ที่ได้รับทางอีเมล <br>เพื่อตั้งรหัสผ่านใหม่</p>
        </div>

        <div class="space-y-5">
            
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2 ml-1">รหัส OTP (6 หลัก)</label>
                <div class="relative">
                    <input type="text" id="otp-input" maxlength="6" placeholder="XXXXXX" 
                        class="w-full pl-12 pr-4 py-3 rounded-xl border border-gray-300 focus:border-rice_green focus:ring-2 focus:ring-green-100 outline-none transition text-center tracking-[0.2em] font-bold text-lg text-gray-700 bg-gray-50 focus:bg-white">
                    <span class="absolute left-4 top-3.5 text-gray-400">
                        <i class="fa-solid fa-key"></i>
                    </span>
                </div>
            </div>

            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2 ml-1">รหัสผ่านใหม่</label>
                <div class="relative">
                    <input type="password" id="new-password" placeholder="••••••••" 
                        class="w-full pl-12 pr-4 py-3 rounded-xl border border-gray-300 focus:border-rice_green focus:ring-2 focus:ring-green-100 outline-none transition bg-gray-50 focus:bg-white">
                    <span class="absolute left-4 top-3.5 text-gray-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                </div>
            </div>

            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2 ml-1">ยืนยันรหัสผ่านใหม่</label>
                <div class="relative">
                    <input type="password" id="confirm-password" placeholder="••••••••" 
                        class="w-full pl-12 pr-4 py-3 rounded-xl border border-gray-300 focus:border-rice_green focus:ring-2 focus:ring-green-100 outline-none transition bg-gray-50 focus:bg-white">
                    <span class="absolute left-4 top-3.5 text-gray-400">
                        <i class="fa-solid fa-check-circle"></i>
                    </span>
                </div>
            </div>

            <button onclick="resetPassword()" id="submit-btn" 
                class="w-full bg-rice_green hover:bg-green-700 text-white font-bold py-3.5 rounded-xl shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all duration-200 mt-4">
                ยืนยันการเปลี่ยนรหัสผ่าน
            </button>

            <div class="text-center mt-6">
                <a href="forgot_password.html" class="text-gray-400 hover:text-gray-600 text-sm font-bold transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-arrow-left"></i> ย้อนกลับ / ขอรหัสใหม่
                </a>
            </div>
        </div>
    </div>

    <script>
const API_URL = window.RICE_API_URL || '';
        async function resetPassword() {
            const otp = document.getElementById('otp-input').value.trim();
            const newPass = document.getElementById('new-password').value;
            const confirmPass = document.getElementById('confirm-password').value;
            const btn = document.getElementById('submit-btn');

            if (otp.length !== 6) return alert('กรุณากรอกรหัส OTP 6 หลัก');
            if (newPass.length < 6) return alert('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');
            if (newPass !== confirmPass) return alert('รหัสผ่านไม่ตรงกัน');

            btn.innerText = 'กำลังตรวจสอบ...';
            btn.disabled = true;
            btn.classList.add('opacity-70', 'cursor-not-allowed');

            try {
                const res = await fetch(`${API_URL}/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        token: otp,  
                        newPassword: newPass 
                    })
                });

                const data = await res.json();
                
                if (data.success) {
                    // Success UI
                    alert('✅ เปลี่ยนรหัสผ่านเรียบร้อยแล้ว!\nกรุณาเข้าสู่ระบบด้วยรหัสผ่านใหม่');
                    window.location.href = 'index.html';
                } else {
                    // Error UI
                    alert('❌ ' + (data.message || 'เกิดข้อผิดพลาด'));
                    resetButton();
                }
            } catch (err) {
                console.error(err);
                alert('ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้');
                resetButton();
            }
        }

        function resetButton() {
            const btn = document.getElementById('submit-btn');
            btn.innerText = 'ยืนยันการเปลี่ยนรหัสผ่าน';
            btn.disabled = false;
            btn.classList.remove('opacity-70', 'cursor-not-allowed');
        }
    </script>
</body>
</html>
